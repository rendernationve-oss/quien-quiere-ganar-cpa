    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Compatibility shield: ensure window.fetch has both getter and setter so browser extensions can safely intercept it
      (function() {
        try {
          var _origFetch = window.fetch ? window.fetch.bind(window) : null;
          var _activeFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _activeFetch;
            },
            set: function(val) {
              _activeFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}

        // Suppress external chrome-extension injection errors that pollute the app console
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
